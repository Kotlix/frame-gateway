components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    GatewayUpdateVoiceRequest:
      required:
        - directoryId
        - name
        - order
      type: object
      properties:
        name:
          type: string
        directoryId:
          type: integer
          format: int64
        order:
          type: integer
          format: int32
    GatewayVoiceDto:
      required:
        - communityId
        - directoryId
        - id
        - name
        - order
      type: object
      properties:
        id:
          type: integer
          format: int64
        communityId:
          type: integer
          format: int64
        name:
          type: string
        directoryId:
          type: integer
          format: int64
        order:
          type: integer
          format: int32
    GatewayUpdateRoleRequest:
      required:
        - priority
        - rights
        - roleName
      type: object
      properties:
        roleName:
          type: string
        priority:
          type: integer
          format: int32
        rights:
          type: object
          additionalProperties:
            type: boolean
    GatewayRoleDto:
      required:
        - communityId
        - id
        - priority
        - rights
        - roleName
      type: object
      properties:
        id:
          type: integer
          format: int64
        communityId:
          type: integer
          format: int64
        roleName:
          type: string
        priority:
          type: integer
          format: int32
        rights:
          type: object
          additionalProperties:
            type: boolean
    GatewayUpdateDirectoryRequest:
      required:
        - name
        - order
      type: object
      properties:
        name:
          type: string
        directoryId:
          type: integer
          format: int64
        order:
          type: integer
          format: int32
    GatewayDirectoryDto:
      required:
        - communityId
        - id
        - name
        - order
      type: object
      properties:
        id:
          type: integer
          format: int64
        communityId:
          type: integer
          format: int64
        name:
          type: string
        directoryId:
          type: integer
          format: int64
        order:
          type: integer
          format: int32
    GatewayUpdateCommunityRequest:
      required:
        - isPublic
        - name
        - voiceName
        - voiceRegion
      type: object
      properties:
        name:
          type: string
        desc:
          type: string
        isPublic:
          type: boolean
        voiceRegion:
          type: string
        voiceName:
          type: string
    GatewayCommunityDto:
      required:
        - id
        - isPublic
        - name
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean
    GatewayUpdateChatRequest:
      required:
        - directoryId
        - name
        - order
      type: object
      properties:
        name:
          type: string
        directoryId:
          type: integer
          format: int64
        order:
          type: integer
          format: int32
    GatewayChatDto:
      required:
        - communityId
        - directoryId
        - id
        - name
        - order
      type: object
      properties:
        id:
          type: integer
          format: int64
        communityId:
          type: integer
          format: int64
        name:
          type: string
        directoryId:
          type: integer
          format: int64
        order:
          type: integer
          format: int32
    GatewayConnectionGuide:
      required:
        - channelId
        - hostAddress
        - shadowId
      type: object
      properties:
        hostAddress:
